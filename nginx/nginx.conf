upstream user_service {
    server user-service:8000;
}

upstream product_service {
    server product-service:8001;
}

server {
    listen 80;
    server_name localhost;

    # User service routes
    location /api/users {
        proxy_pass http://user_service/users;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # User login route
    location /api/users/login {
        proxy_pass http://user_service/users/login;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Product service routes
    location /api/products {
        proxy_pass http://product_service/products;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health check endpoints
    location /api/users/health {
        proxy_pass http://user_service/health;
    }

    location /api/products/health {
        proxy_pass http://product_service/health;
    }

    # Root health check
    location /health {
        default_type application/json;
        return 200 '{"status": "healthy", "service": "gateway"}';
    }
}
