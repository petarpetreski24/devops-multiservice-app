name: CI Pipeline

on:
  push:
    branches: ["*"]
  pull_request:
    branches: [main, develop]

jobs:
  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [user-service, product-service]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          cd ${{ matrix.service }}
          pip install -r requirements.txt
          pip install flake8

      - name: Run flake8
        run: |
          cd ${{ matrix.service }}
          flake8 app/ --max-line-length=120 --exclude=__pycache__

  test-user-service:
    name: Test User Service
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          cd user-service
          pip install -r requirements.txt

      - name: Run tests
        run: |
          cd user-service
          pytest tests/ -v --tb=short

  test-product-service:
    name: Test Product Service
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          cd product-service
          pip install -r requirements.txt

      - name: Run tests
        run: |
          cd product-service
          pytest tests/ -v --tb=short

  build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [test-user-service, test-product-service]
    steps:
      - uses: actions/checkout@v4

      - name: Build User Service Image
        run: docker build -t user-service ./user-service

      - name: Build Product Service Image
        run: docker build -t product-service ./product-service

      - name: Build Nginx Image
        run: docker build -t nginx-gateway ./nginx

      - name: Verify Docker Compose config
        run: docker compose config

  push-images:
    name: Push Docker Images to GHCR
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image tag
        id: tag
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "TAG=latest" >> $GITHUB_OUTPUT
          else
            echo "TAG=dev-${{ github.sha }}" >> $GITHUB_OUTPUT
          fi

      - name: Build and push User Service
        run: |
          docker build -t ghcr.io/${{ github.repository }}/user-service:${{ steps.tag.outputs.TAG }} ./user-service
          docker push ghcr.io/${{ github.repository }}/user-service:${{ steps.tag.outputs.TAG }}

      - name: Build and push Product Service
        run: |
          docker build -t ghcr.io/${{ github.repository }}/product-service:${{ steps.tag.outputs.TAG }} ./product-service
          docker push ghcr.io/${{ github.repository }}/product-service:${{ steps.tag.outputs.TAG }}
